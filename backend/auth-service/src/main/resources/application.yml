server:
  port: 8101

spring:
  application:
    name: auth-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_community?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 192.168.80.80
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.80.80:8848}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  expiration: 7200000

internal:
  token: ${INTERNAL_TOKEN:}

oss:
  endpoint: oss-cn-shenzhen.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: blue-oss060924
  url-prefix: https://blue-oss060924.oss-cn-shenzhen.aliyuncs.com/

rocketmq:
  name-server: 192.168.80.80:9876
  producer:
    group: auth-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# Feign 熔断降级（Sentinel）+ 内部调用快失败超时
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
  level:
    com.knowledgecommunity: debug
