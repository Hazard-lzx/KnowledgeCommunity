server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_community?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 192.168.80.80
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 5
      timeout: 3000ms

    elasticsearch:
      repositories:
        enabled: false

  elasticsearch:
    uris: http://192.168.80.80:9200
    username: elastic
    password: ${ES_PASSWORD}

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5s

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: deepseek-v3
          temperature: 0.7
      embedding:
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: YourSuperSecretKeyForHS256AlgorithmMustBeAtLeast256BitsLong!!
  expiration: 7200000

rocketmq:
  name-server: 192.168.80.80:9876
  producer:
    group: knowledge-community-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

oss:
  endpoint: oss-cn-shenzhen.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: blue-oss0924
  url-prefix: https://blue-oss0924.oss-cn-shenzhen.aliyuncs.com/

deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  chat-model: deepseek-v3
  embedding-base-url: https://api.siliconflow.cn/v1
  embedding-api-key: ${SILICONFLOW_API_KEY}
  embedding-model: BAAI/bge-large-zh-v1.5

logging:
  level:
    com.knowledgecommunity: debug
    org.springframework.data.elasticsearch: debug
